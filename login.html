<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Bite Box</title>
<meta name="description" content="Login to your Bite Box account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a href="index.html" class="brand"><span class="brand-mark">BB</span>Bite <span>Box</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="offers.html">Offers</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="icon-link" aria-label="Cart">🛍️</a>
    </div>
  </div>
</header>

<main class="auth-split">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=900&q=80" alt="Bite Box gourmet burger presentation">
    <div class="auth-visual-content">
      <span class="hero-eyebrow">Welcome Back</span>
      <h2 style="margin-top:1rem;">Good Food Missed You Too</h2>
      <p>Sign in to reorder favorites, track deliveries and unlock member-only offers.</p>
    </div>
  </div>

  <div class="section" style="display:flex; align-items:center; justify-content:center; padding-block:3rem;">
    <div class="auth-card reveal">
      <div class="text-center" style="margin-bottom:1.8rem;">
        <a href="index.html" class="brand" style="justify-content:center; display:inline-flex;"><span class="brand-mark">BB</span>Bite <span>Box</span></a>
        <p style="color:var(--text-muted); margin-top:.6rem;">Login to your account</p>
      </div>

      <form action="#" method="post">
        <div class="form-group">
          <label for="l-email">Email Address</label>
          <input class="input" type="email" id="l-email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="l-password">Password</label>
          <input class="input" type="password" id="l-password" name="password" required minlength="6" placeholder="••••••••">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.4rem;">
          <label class="check-row"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#" style="font-size:.85rem; color:var(--gold-light);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login →</button>
      </form>

      <p class="text-center" style="margin-top:1.6rem; color:var(--text-muted); font-size:.9rem;">
        Don't have an account? <a href="signup.html" style="color:var(--gold-light); font-weight:600;">Sign up</a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
